<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>マイ検索ツール</title>
  <style>
    body { font-family: sans-serif; background: #141414; color: white; text-align: center; padding-top: 50px; margin: 0; }
    .box { background: #222; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: inline-block; width: 90%; max-width: 500px; margin-bottom: 20px; }
    h2 { color: #00bcd4; margin-top: 0; }
    input[type="text"] { width: 80%; padding: 12px; border: 1px solid #444; background: #333; color: white; border-radius: 6px; font-size: 16px; margin-bottom: 15px; text-align: center; }
    button { padding: 12px 30px; background: #00bcd4; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; width: 85%; }
    button:hover { background: #0097a7; }
    #view-container { width: 95%; height: 750px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; background: white; display: none; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="box" id="search-box">
    <h2>🌐 マイWeb検索ツール (ガチ完成版)</h2>
    <p>見たいサイトのURLを入力してください</p>
    <input type="text" id="url-input" placeholder="https://example.com">
    <br>
    <button onclick="launchProxy()">サイトを強制起動</button>
  </div>

  <div id="view-container">
    <iframe id="proxy-viewer" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
  </div>

  <script>
    function launchProxy() {
      var input = document.getElementById('url-input').value.trim();
      if (!input) return alert('URLを入力してください！');
      if (input.indexOf('http') !== 0) input = 'https://' + input;

      // サーバーのキャッシュをバイパスして、直接生データをぶち抜くCORSプロキシURL
      var proxyUrl = 'https://allorigins.win' + encodeURIComponent(input);

      var viewer = document.getElementById('proxy-viewer');
      var container = document.getElementById('view-container');

      // 画面を切り替えて埋め込みエリアに出現させる
      viewer.src = proxyUrl;
      container.style.display = 'block';
      document.getElementById('search-box').style.display = 'none'; // 検索窓は隠す
    }
  </script>
</body>
</html>
